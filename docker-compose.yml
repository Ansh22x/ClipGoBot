version: '3.8'

services:
  tg-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: tg_bot_api
    restart: unless-stopped
    environment:
      - TELEGRAM_API_ID=${TELEGRAM_API_ID:-39175184}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH:-312218596f149936be1ef2790cbd91cd}
    command:
      - "--api-id=${TELEGRAM_API_ID:-39175184}"
      - "--api-hash=${TELEGRAM_API_HASH:-312218596f149936be1ef2790cbd91cd}"
      - "--local"
      - "--http-port=8081"
      - "--dir=/data"
      - "--max-webhook-connections=100"
    volumes:
      - ./tg-data:/data
      - ./downloads:/app/downloads
    ports:
      - "127.0.0.1:8081:8081"

  bgutil:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: bgutil_pot_provider
    restart: unless-stopped
    ports:
      - "127.0.0.1:4416:4416"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:4416/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  tg-downloader-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tg_media_downloader_bot
    restart: unless-stopped
    depends_on:
      - tg-bot-api
      - bgutil
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./downloads:/app/downloads
    environment:
      - DB_PATH=/app/data/bot.db
      - DOWNLOAD_DIR=/app/downloads
      - MAX_CONCURRENT_DOWNLOADS=4
      - TELEGRAM_UPLOAD_LIMIT_MB=1900
      - TG_API_BASE=http://tg-bot-api:8081
      - POT_PROVIDER_URL=http://bgutil:4416
